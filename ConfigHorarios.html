<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuración de Horarios - Xamaran</title>
    <link rel="stylesheet" href="Config.css" />
</head>
<body>

    <h1>Editar Horarios</h1>
    <a href="Config.html" class="btn-back">
        <span>←</span> Volver a Configuración
    </a>
    
    <div class="container">
        <section class="schedule-form">
            <h2>Editar Horarios</h2>
            <form id="horariosForm">
                <div id="daysContainer"></div>
                <div style="text-align: right; margin-top: 20px;">
                    <button type="submit">Guardar horarios</button>
                    <button type="button" id="resetBtn">Limpiar</button>
                </div>
            </form>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://cbtvetmvxvxhidsgpcoh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNidHZldG12eHZ4aGlkc2dwY29oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MzM4NzMsImV4cCI6MjA4NzQwOTg3M30.kphDJaqTCBzHuDSraol0gaDOTMfYf7eHNHaQGy3Ab7o';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const days = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
        const container = document.getElementById('daysContainer');

        // Genera la estructura vacía del formulario
        function initHorarios() {
            container.innerHTML = '';
            days.forEach((day, i) => {
                const row = document.createElement('div');
                row.className = 'day-row';
                row.innerHTML = `<label>${day}</label><input type="time" id="start-${i}"><span>-</span><input type="time" id="end-${i}">`;
                container.appendChild(row);
            });
        }

        // NUEVO: Descarga los datos de Supabase y los inyecta en los inputs (Vista previa)
        async function cargarHorariosPrevia() {
            initHorarios(); // Primero creamos los inputs vacíos

            const { data: horarios, error } = await _supabase
                .from('Horarios')
                .select('*');

            if (error) {
                console.error("Error al cargar la vista previa de horarios:", error.message);
                return;
            }

            if (horarios && horarios.length > 0) {
                horarios.forEach(registro => {
                    // Buscamos en qué posición del array 'days' está el día de la base de datos
                    const index = days.indexOf(registro.Dia);
                    
                    if (index !== -1 && registro.hora) {
                        // Separamos el string "10:00 - 20:00" en ["10:00", "20:00"]
                        const partesHora = registro.hora.split(' - ');
                        
                        if (partesHora.length === 2) {
                            const startInput = document.getElementById(`start-${index}`);
                            const endInput = document.getElementById(`end-${index}`);
                            
                            if (startInput) startInput.value = partesHora[0].trim();
                            if (endInput) endInput.value = partesHora[1].trim();
                        }
                    }
                });
            }
        }

        // Manejador del envío del formulario (Guarda o actualiza)
        document.getElementById('horariosForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rows = days.map((day, i) => {
                const startVal = document.getElementById(`start-${i}`).value;
                const endVal = document.getElementById(`end-${i}`).value;
                
                // Si ambos campos están vacíos, guardamos una cadena vacía o indicación de cerrado
                const horaString = (startVal && endVal) ? `${startVal} - ${endVal}` : '';

                return {
                    Dia: day,
                    hora: horaString
                };
            });

            // Usamos upsert. Recuerda que para que actualice correctamente en base al día,
            // la columna 'Dia' debería estar configurada como clave primaria o índice único en Supabase.
            const { error } = await _supabase.from('Horarios').upsert(rows);
            alert(error ? "Error: " + error.message : "Horarios actualizados con éxito");
            
            // Recargamos la vista previa por seguridad
            cargarHorariosPrevia();
        });

        // Botón de limpiar restablece los inputs y vuelve a traer lo que hay en la BD
        document.getElementById('resetBtn').addEventListener('click', () => cargarHorariosPrevia());

        // Ejecución inicial automática al cargar el DOM
        document.addEventListener('DOMContentLoaded', cargarHorariosPrevia);
    </script>
    
</body>
</html>
