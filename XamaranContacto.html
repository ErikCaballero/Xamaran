            margin: 0;
            padding: 0;
            background-color: #ffe6eb;
            background-image: radial-gradient(#ffcad4 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff5e78;
            font-size: 2.2rem;
            margin-top: 20px;
            text-shadow: 2px 2px white;
            z-index: 10;
        }

        .game-layout {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 95%;
            height: 80vh;
            margin-top: 10px;
            z-index: 10;
        }

        .click-zone {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(255, 94, 120, 0.2);
            position: relative;
        }

        #score { font-size: 3rem; color: #ff5e78; font-weight: bold; }
        #per-second { color: #888; font-size: 0.9rem; margin-bottom: 20px; }

        #main-heart {
            font-size: 7rem;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 10px rgba(255, 94, 120, 0.5));
            background: none;
            border: none;
        }

        #main-heart:active { transform: scale(0.9); }

        .shop-zone {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        .shop-item {
            background: white;
            border: 2px solid #ffcbd4;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-btn {
            background: #ff8fa3;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- NOTIFICACIÓN DE LOGROS --- */
        #achievement-popup {
            position: fixed;
            top: 20px;
            right: -350px; /* Oculto inicialmente */
            width: 300px;
            background: white;
            border: 3px solid #ff5e78;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 5000;
            transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #achievement-popup.show {
            right: 20px;
        }

        .ach-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .ach-text h4 { margin: 0; color: #ff5e78; font-size: 1rem; }
        .ach-text p { margin: 2px 0 0; color: #888; font-size: 0.8rem; }


        /* --- IMAGEN SORPRESA Y CORAZÓN DORADO --- */
        #bonus-img {
            position: absolute;
            width: 80px;
            height: 80px;
            cursor: pointer;
            display: none; 
            z-index: 1000;
            animation: wiggle 1s infinite;
        }

        #gold-heart {
            position: absolute;
            width: 70px;
            height: 70px;
            display: none;
            z-index: 2000;
            cursor: pointer;
            transition: top 1s linear, left 1s linear; 
            filter: drop-shadow(0 0 15px #ffd700);
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        .floater {
            position: absolute;
            color: #ff5e78;
            font-weight: bold;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 3000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        /* --- GALERÍA DE AUTOCLICKERS --- */
        #gallery-container {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 350px;
            height: 400px;
            display: flex;
            flex-wrap: wrap-reverse;
            align-content: flex-start;
            gap: 5px;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .gallery-item {
            width: 45px;
            height: 45px;
            object-fit: contain;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.1));
        }

        /* El fondo oscuro que cubre toda la pantalla */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Fondo muy oscuro */
            backdrop-filter: blur(10px); /* Efecto borroso elegante */
            z-index: 10000; /* Siempre encima de todo */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Clase para mostrar el modal */
        .modal-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* La tarjeta del mensaje */
        .modal-content {
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            padding: 3rem;
            border-radius: 25px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3); /* Borde dorado sutil */
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 500px;
        }

        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }

        /* Icono y Textos */
        .trofeo-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: flotar 3s infinite ease-in-out;
        }

        .titulo-epico {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to right, #FFD700, #FDB931, #FFD700);
            -webkit-background-clip: text;
            color: transparent; /* Texto con gradiente dorado */
            font-weight: 900;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.5);
        }

        .mensaje-epico {
            color: #e0e0e0;
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 20px 0 40px 0;
        }

        /* Botón bonito */
        .btn-continuar {
            background: #FFD700;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-continuar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .hidden {
            display: none; /* Asegura que no estorbe si no está activo */
        }

        /* Animación de flotar para el trofeo */
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 700px) {
            .game-layout { flex-direction: column; height: auto; padding-bottom: 220px; }
            .shop-zone { max-height: 400px; }

            #achievement-popup { width: 80%; top: 10px; }
        }

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;

            "https://stickerly.pstatic.net/sticker_pack/XwQUMOSDp2F66L1QMMNTDA/2LS2A5/4/sticker_1.png"
        ]
        const misImagenesBonus = [
            "https://png.pngtree.com/recommend-works/png-clipart/20250321/ourmid/pngtree-cute-illustration-of-baby-dinosaur-png-image_15832645.png",
            "https://images.vexels.com/media/users/3/322428/isolated/preview/038bef0d3e89523cad0e5d87b7e9115e-dinosaurio-caminando-con-regalos-de-cumpleanos-en-la-espalda.png",

        ];

        
        const multipliers = [
            { id: 'bonus_unlock', name: "Mini Dinos", cost: 150, power: 1, bought: false },
            { id: 'gold_unlock', name: "Corazón Dorado", cost: 750, power: 1, bought: false },
            { id: 'm1', name: "Doble Click", cost: 120, power: 2, bought: false },
            { id: 'm2', name: "Triple Click", cost: 280, power: 3, bought: false },
            { id: 'm3', name: "Click x4", cost: 560, power: 4, bought: false },
            { id: 'm4', name: "Click x5", cost: 1280, power: 5, bought: false },
            { id: 'm5', name: "Click x6", cost: 2130, power: 6, bought: false },
            { id: 'm6', name: "Click x7", cost: 3500, power: 7, bought: false },
            { id: 'm7', name: "Click x8", cost: 4600, power: 8, bought: false },
            { id: 'm8', name: "Click x9", cost: 5600, power: 9, bought: false },
            { id: 'm9', name: "Click x10", cost: 8500, power: 10, bought: false },
            { id: 'm10', name: "Click x15", cost: 12000, power: 15, bought: false },
            { id: 'm11', name: "Click x20", cost: 20000, power: 20, bought: false },
            { id: 'm12', name: "Click x25", cost: 25500, power: 25, bought: false },
            { id: 'm13', name: "Click x30", cost: 50000, power: 30, bought: false },
            { id: 'm14', name: "Click x50", cost: 75000, power: 50, bought: false },
            { id: 'm15', name: "Click x75", cost: 86500, power: 75, bought: false },
            { id: 'm16', name: "Click x100", cost: 100000, power: 100, bought: false },
            { id: 'm17', name: "Click x150", cost: 150000, power: 150, bought: false }, 
            { id: 'm18', name: "Click x200", cost: 250000, power: 200, bought: false },
            { id: 'm19', name: "Click X500", cost: 400000, power: 500, bought: false }, 
            { id: 'm20', name: "Click x1000", cost: 500000, power: 1000, bought: false }

        ];

        const autoClickers = [
            { id: 'a1', name: "Pensamiento fugaz", cost: 1, eps: 1, count: 0 }, // 75
            { id: 'a2', name: "Capibara", cost: 1, eps: 5, count: 0 }, // 550
            { id: 'a3', name: "Cositas de amor", cost: 1, eps: 10, count: 0 }, // 1000
            { id: 'a4', name: "Carta de amor", cost: 1, eps: 20, count: 0 }, //  2200
            { id: 'a5', name: "Siempre en mi mente", cost: 1, eps: 50, count: 0 } // 5000
        ];

        const scoreEl = document.getElementById('score');
        const perSecondEl = document.getElementById('per-second');
        const heartBtn = document.getElementById('main-heart');
        const bonusImg = document.getElementById('bonus-img');
        const goldHeart = document.getElementById('gold-heart');
        const galleryContainer = document.getElementById('gallery-container');
        
        // Elementos de la notificación
        const popup = document.getElementById('achievement-popup');
        const popupImg = document.getElementById('ach-icon');
        const popupTitle = document.getElementById('ach-title');
        const popupSub = document.getElementById('ach-sub');

        let moveInterval;

        // --- FUNCIÓN MOSTRAR LOGRO ---
        function showAchievement(key) {
            const ach = achievementsList[key];
            if (!ach) return;

            // Rellenar datos
            popupImg.src = ach.img;
            popupTitle.innerText = ach.title;
            popupSub.innerText = ach.sub;

            // Mostrar
            popup.classList.add('show');

            // Ocultar después de 4 segundos
            setTimeout(() => {
                popup.classList.remove('show');
            }, 4000);
        }

        // --- SISTEMA DE GUARDADO ---
        function saveGame() {
            const data = { 
                score, 
                clickPower, 
                autoClickPerSecond, 
                totalManualClicks, // Guardamos clicks
                totalUpgradesBought, // Guardamos contador compras
                multipliers,
                autoClickers, 
                bonusDesbloqueado, 
                goldHeartUnlocked,
                collectedImages,
                achievementsList // Guardamos estado de logros (desbloqueados o no)
            };
            localStorage.setItem('amorData', JSON.stringify(data));
        }

        // Referencias al DOM
        const modalMillon = document.getElementById('modal-millon');
        const btnCerrar = document.getElementById('cerrar-millon');

        // Función especial para lanzar MUCHO confeti (Efecto Celebración)
        function lanzarConfetiEpico() {
            var duration = 3000; // 3 segundos de confeti
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10001 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Lanza confeti desde dos puntos (izquierda y derecha)
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function mostrarLogroMillon() {
            // 1. Quitar el 'hidden' para que display funcione
            modalMillon.classList.remove('hidden');
            
            // 2. Pequeño timeout para permitir que la transición CSS de opacidad funcione
            setTimeout(() => {
                modalMillon.classList.add('visible');
            }, 10);

            // 3. ¡FUEGOS ARTIFICIALES!
            lanzarConfetiEpico();
        }

        // Lógica para cerrar el modal
        btnCerrar.addEventListener('click', () => {
            modalMillon.classList.remove('visible');
            
            // Esperar a que termine la animación de desaparición (0.5s) para ocultarlo del DOM
            setTimeout(() => {
                modalMillon.classList.add('hidden');
            }, 500);
        });

        function loadGame() {
            const saved = localStorage.getItem('amorData');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    score = data.score || 0;
                    clickPower = data.clickPower || 1;
                    autoClickPerSecond = data.autoClickPerSecond || 0;
                    totalManualClicks = data.totalManualClicks || 0;
                    totalUpgradesBought = data.totalUpgradesBought || 0;
                    bonusDesbloqueado = !!data.bonusDesbloqueado;
                    goldHeartUnlocked = !!data.goldHeartUnlocked;
                    collectedImages = data.collectedImages || [];

                    if (data.multipliers) {
                        multipliers.forEach((m) => {
                            const savedM = data.multipliers.find(sm => sm.id === m.id);
                            if (savedM) m.bought = savedM.bought;
                        });
                    }

                    if (data.autoClickers) {
                        autoClickers.forEach((a) => {
                            const savedA = data.autoClickers.find(sa => sa.id === a.id);
                            if (savedA) {
                                a.count = savedA.count;
                                a.cost = savedA.cost;
                            }
                        });
                    }

                    // Cargar logros desbloqueados
                    if (data.achievementsList) {
                        for (const key in data.achievementsList) {
                            if (achievementsList[key]) {
                                achievementsList[key].unlocked = data.achievementsList[key].unlocked;
                            }
                        }
                    }

                } catch (e) {
                    console.error("Error al cargar los datos:", e);
                }
            }
        }

        function resetGame() {
            if(confirm("¿Seguro que quieres borrar todo tu progreso de amor? ❤️")) {
                localStorage.removeItem('amorData');
                location.reload();
            }
        }

        // --- CHEQUEO DE LOGROS ---
        function checkClickAchievements() {
            const milestones = [1, 100, 1000, 10000, 100000, 1000000];
            milestones.forEach(m => {
                const key = `click_${m}`;
                
                // --- CAMBIO SOLICITADO ---
                // Si la meta es 1.000.000, chequeamos el SCORE (contador actual).
                // Para los demás, chequeamos los clicks manuales.

                if (m === 1000000) {
                    if (score >= 1000000){
                        if (!achievementsList[key].unlocked) {
                        achievementsList[key].unlocked = true;
                        showAchievement(key);
                        mostrarLogroMillon();
                    }
                    }
                } 

                if (!achievementsList[key].unlocked) {
                    achievementsList[key].unlocked = true;
                    showAchievement(key);
                    mostrarLogroMillon();
                }
            });
        }

        function checkUpgradeAchievements(item) {
            // Logros genéricos de compra
            if (totalUpgradesBought >= 1 && !achievementsList['upgrade_1'].unlocked) {
                achievementsList['upgrade_1'].unlocked = true;
                showAchievement('upgrade_1');
            }
            if (totalUpgradesBought >= 10 && !achievementsList['upgrade_10'].unlocked) {
                achievementsList['upgrade_10'].unlocked = true;
                showAchievement('upgrade_10');
            }

            // Logros específicos (x10 y x50)
            if (item.id === 'm9' && !achievementsList['buy_x10'].unlocked) {
                achievementsList['buy_x10'].unlocked = true;
                showAchievement('buy_x10');
            }
            if (item.id === 'm14' && !achievementsList['buy_x50'].unlocked) {
                achievementsList['buy_x50'].unlocked = true;
                showAchievement('buy_x50');
            }
        }

        function checkAutoAchievements(item) {
            // Chequeo dinámico para 1, 5 y 10 de cada tipo
            const levels = [1, 5, 10];
            const prefixes = { 1: 'first', 5: 'five', 10: 'ten' };

            levels.forEach(lvl => {
                if (item.count >= lvl) {
                    const key = `${prefixes[lvl]}_${item.id}`;
                    if (achievementsList[key] && !achievementsList[key].unlocked) {
                        achievementsList[key].unlocked = true;
                        showAchievement(key);
                    }
                }
            });
        }

        // --- FUNCIONES DE COMPRA ---
        function buyMultiplier(i) {
            const item = multipliers[i];
            if (item.bought && (item.id.includes('unlock') || item.power <= clickPower)) return;

            if (score >= item.cost) {
                score -= item.cost;
                item.bought = true;
                totalUpgradesBought++; // Aumentar contador

                if (item.id === 'bonus_unlock') bonusDesbloqueado = true;
                if (item.id === 'gold_unlock') goldHeartUnlocked = true;
                if (item.power > clickPower) clickPower = item.power;
                
                checkUpgradeAchievements(item); // Chequear logros

                renderShop(); 
                updateUI(); 
                saveGame();
            } else { 
                alert("¡Necesitas más amor! ❤️"); 
            }
        }

        function buyAuto(i) {
            const item = autoClickers[i];
            if (score >= item.cost) {
                score -= item.cost;
                item.count++;
                autoClickPerSecond += item.eps;
                item.cost = Math.ceil(item.cost * 1.5);
                
                // Lógica de imágenes en galería
                let arrayOrigen = [];
                if (item.id === 'a1') arrayOrigen = imagenesFugaces;
                else if (item.id === 'a2') arrayOrigen = imagenesCapybara;
                else if (item.id === 'a3') arrayOrigen = imagenesCositas;
                else if (item.id === 'a4') arrayOrigen = imagenesCartas;
                else if (item.id === 'a5') arrayOrigen = imagenesMente;

                if (arrayOrigen.length > 0) {
                    const imagenAleatoria = arrayOrigen[Math.floor(Math.random() * arrayOrigen.length)];
                    collectedImages.push(imagenAleatoria);
                    renderGallery();
                }
                
                checkAutoAchievements(item); // Chequear logros

                renderShop(); 
                updateUI(); 
                saveGame();
            } else { 
                alert("¡Necesitas más amor! ❤️"); 
            }
        }

        function renderShop() {
            const mList = document.getElementById('multipliers-list');
            const sList = document.getElementById('special-list');
            const aList = document.getElementById('autoclickers-list');
            
            mList.innerHTML = ''; sList.innerHTML = ''; aList.innerHTML = '';

            let maxPowerOwned = 1;
            multipliers.forEach(m => {
                if (m.bought && m.power > maxPowerOwned) maxPowerOwned = m.power;
            });

            multipliers.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'shop-item';

                if (item.id.includes('unlock')) {
                    div.innerHTML = `
                        <span><b>${item.name}</b> (${item.cost} ❤️)</span>
                        <button class="shop-btn" onclick="buyMultiplier(${index})">${item.bought ? 'Desbloqueado' : 'Comprar'}</button>
                    `;
                    sList.appendChild(div);
                } else {
                    const esLaMejor = item.bought && item.power === maxPowerOwned;
                    let textoBoton = item.bought ? (esLaMejor ? "Actual" : "Superado") : "Comprar";
                    div.innerHTML = `
                        <span><b>${item.name}</b> (${item.cost} ❤️)</span>
                        <button class="shop-btn" onclick="buyMultiplier(${index})">${textoBoton}</button>
                    `;
                    mList.appendChild(div);
                }
            });

            autoClickers.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div class="item-info"><b>${item.name}</b><br><small>+${item.eps}/s | Tienes: ${item.count}</small></div>
                    <button class="shop-btn" onclick="buyAuto(${index})">${item.cost} ❤️</button>
                `;
                aList.appendChild(div);
            });
        }

        // --- BONUS ---
        function spawnBonus() {
            if (!bonusDesbloqueado) return;
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 80;
            bonusImg.style.left = Math.random() * maxX + 'px';
            bonusImg.style.top = Math.random() * maxY + 'px';
            bonusImg.style.display = 'block';
            
            // Elegir imagen de bonus aleatoria
            const rndImg = misImagenesBonus[Math.floor(Math.random() * misImagenesBonus.length)];
            bonusImg.src = rndImg;

            setTimeout(() => { bonusImg.style.display = 'none'; }, 3000); // 3 seg para click
        }

        bonusImg.onclick = function() {
            bonusImg.style.display = 'none';
            const bonus = score * 0.5; // 50% del score actual
            const val = Math.floor(bonus > 100 ? bonus : 100);
            score += val;
            createFloater(event.clientX, event.clientY, `+${val} Extra!`);
            updateUI();
        };

        // --- CORAZÓN DORADO (Móvil) ---
        function moveGoldHeart() {
            if (!goldHeartUnlocked) return;
            goldHeart.style.display = 'block';
            
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 80;
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            goldHeart.style.left = x + 'px';
            goldHeart.style.top = y + 'px';
        }

        goldHeart.onclick = function() {
            score += 1000 * clickPower;
            createFloater(event.clientX, event.clientY, `+${1000 * clickPower} GOLD!`);
            updateUI();
            goldHeart.style.display = 'none';
            // Respawn rápido
            setTimeout(moveGoldHeart, 5000); 
        };

        // --- EFECTO FLOTANTE ---
        function createFloater(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floater';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- GALERÍA VISUAL ---
        function renderGallery() {
            galleryContainer.innerHTML = '';
            // Mostrar solo las últimas 15 para no saturar
            const ultimas = collectedImages.slice(-15);
            ultimas.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'gallery-item';
                galleryContainer.appendChild(img);
            });
        }

        // --- LOOP PRINCIPAL ---
        heartBtn.onclick = function(e) {
            score += clickPower;
            totalManualClicks++;
            
            checkClickAchievements();

            createFloater(e.clientX, e.clientY, `+${clickPower}`);
            updateUI();
        };

        function autoClickLoop() {
            if (autoClickPerSecond > 0) {
                score += autoClickPerSecond;
                updateUI();
            }
        }

        function updateUI() {
            scoreEl.innerText = Math.floor(score);
            perSecondEl.innerText = `Amor por segundo: ${autoClickPerSecond}`;
            // document.title = `${Math.floor(score)} ❤️ - Cuqui Clicker`; // Opcional
        }

        // --- INICIO ---
        loadGame();
        renderShop();
        renderGallery();
        updateUI();

        setInterval(autoClickLoop, 1000); // Autoclick cada seg
        setInterval(saveGame, 5000); // Guardado auto
        setInterval(() => { if(bonusDesbloqueado) spawnBonus(); }, 20000); // Bonus cada 20s
        setInterval(() => { if(goldHeartUnlocked) moveGoldHeart(); }, 8000); // Movimiento Golden Heart
        
    </script>
