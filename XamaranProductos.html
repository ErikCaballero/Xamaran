  <script>
    document.addEventListener('DOMContentLoaded', function(){
      // preload common sounds
      const biteSound = new Audio('sonidos/Mordisco.mp3');
      biteSound.preload = 'auto';
      biteSound.volume = 0.9;

      const shakeSrc = 'sonidos/Sacudirpaquete.mp3';

      document.querySelectorAll('.paquete').forEach(function(p){
        p.style.cursor = 'pointer';

        // --- chocolate cycling behavior (if multiple imagenchocolate images present) ---
        const chocImgs = Array.from(p.querySelectorAll('img.imagenchocolate'));
        if (chocImgs.length >= 2) {
          const srcs = chocImgs.map(function(i){ return i.src; });
          const main = chocImgs[0];
          chocImgs.slice(1).forEach(function(i){ i.remove(); });

          let idx = 0;
          let intervalId = null;

          p.addEventListener('mouseenter', function(){
            // play bite sound once on hover
            try {
              biteSound.currentTime = 0;
              const playPromise = biteSound.play();
              if (playPromise !== undefined) playPromise.catch(function(){});
            } catch(e){}

            if (intervalId) return;
            intervalId = setInterval(function(){
              idx = (idx + 1) % srcs.length;
              main.src = srcs[idx];
            }, 350);
          });

          p.addEventListener('mouseleave', function(){
            if (intervalId) { clearInterval(intervalId); intervalId = null; }
            idx = 0; main.src = srcs[0];
            try { biteSound.pause(); biteSound.currentTime = 0; } catch(e){}
          });
        }

        // --- shake sound loop for paquetes with imagenpaquete ---
        const packImg = p.querySelector('img.imagenpaquete');
        if (packImg) {
          // create a dedicated audio instance per paquete so multiple hovers can play independently
          const shakeAudio = new Audio(shakeSrc);
          shakeAudio.preload = 'auto';
          shakeAudio.loop = true;
          shakeAudio.volume = 0.7;

          p.addEventListener('mouseenter', function(){
            try {
              shakeAudio.currentTime = 0;
              const playPromise = shakeAudio.play();
              if (playPromise !== undefined) playPromise.catch(function(){});
            } catch(e){}
          });

          p.addEventListener('mouseleave', function(){
            try { shakeAudio.pause(); shakeAudio.currentTime = 0; } catch(e){}
          });
        }
      });
    });
  </script>
</body>
</html>
